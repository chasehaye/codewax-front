name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Deploy via SSH
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
          ROOT_DIR: ${{ secrets.ROOT_DIR }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/config <<EOF
          Host $SERVER_HOST
              User $SERVER_USER
              IdentityFile ~/.ssh/deploy_key
              ProxyCommand cloudflared access ssh --hostname %h
              StrictHostKeyChecking no
          EOF

          ssh "$SERVER_HOST" 'bash -s' <<'EOF'
            set -e

            APP_DIR="$APP_DIR"
            ROOT_DIR="$ROOT_DIR"

            echo "Pulling latest changes..."
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "Fixing ownership and cleaning previous build cache..."
            sudo chown -R $(whoami):$(whoami) .next node_modules 2>/dev/null || true
            rm -rf .next

            echo "Installing dependencies..."
            npm ci

            echo "Building PRODUCTION environment..."
            npm run build

            echo "Starting application..."
            pm2 delete codewax 2>/dev/null || true
            pm2 start npm --name "codewax" -- run start

            echo "Reloading site..."
            cd "$ROOT_DIR"
            ./handle_service.sh 0
            ./handle_service.sh 1

            echo "Deploy complete."
          EOF
