services:
  web:
    build:
      context: .
      args:
        # Inlined into the client bundle at build time (NEXT_PUBLIC_*).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: codewax
    container_name: codewax
    restart: unless-stopped
    # Host port comes from .env (PORT); the container always serves on 3000.
    ports:
      - "${PORT:-3000}:3000"
